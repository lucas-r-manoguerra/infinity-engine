name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a fast push right after a PR
# push) to avoid wasting runner time on duplicate builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test (Linux, ci preset, ASan/UBSan, clang-tidy)
    runs-on: ubuntu-latest
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            clang-20 clang-format-20 clang-tidy-20 \
            libclang-rt-20-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ci

      - name: Build (runs clang-tidy via CMAKE_CXX_CLANG_TIDY)
        run: cmake --build --preset ci

      - name: Test (ASan/UBSan)
        run: ctest --preset ci

  build-test-macos:
    name: Build + Test (macOS, clang 20, UBSan, clang-tidy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 toolchain (Homebrew, keg-only)
        run: |
          brew install llvm@20 ninja ccache
          # llvm@20 is keg-only: its versioned binaries are not linked into the
          # default PATH. Resolve the per-arch opt prefix and export it as
          # $LLVM_BIN for the configure/build steps. AppleClang (15/16/17) does
          # not satisfy InfinityToolchain's Clang >= 20 baseline (ADR-025).
          if [ "$(uname -m)" = "arm64" ]; then
            echo "LLVM_BIN=/opt/homebrew/opt/llvm@20/bin" >> "$GITHUB_ENV"
          else
            echo "LLVM_BIN=/usr/local/opt/llvm@20/bin" >> "$GITHUB_ENV"
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        # Full compiler paths: CMake requires either a name on PATH or an
        # absolute path for the compiler. The local PATH export also lets
        # InfinityToolchain find clang-tidy-20 during configure. Runner images
        # differ in keg layout (versioned clang++-20 vs plain clang++), so fall
        # back to the unversioned names and log what the keg actually provides.
        #
        # UBSan-only: the Homebrew llvm@20 ASan runtime hangs at startup on the
        # arm64 macOS runners (probes: even a `return 0` ASan binary dies by
        # SIGALRM; the same binary with UBSan-only runs fine). So macOS keeps
        # clang-tidy + UBSan coverage but builds with INFINITY_ENABLE_SANITIZERS
        # off and the UBSan flags injected here, mirroring how the MSVC branch
        # skips an unusable sanitizer while preserving the rest of the ci preset.
        run: |
          export PATH="$LLVM_BIN:$PATH"
          ls -1 "$LLVM_BIN" | grep '^clang' || true
          C_BIN="$LLVM_BIN/clang-20"
          [ -x "$C_BIN" ] || C_BIN="$LLVM_BIN/clang"
          CXX_BIN="$LLVM_BIN/clang++-20"
          [ -x "$CXX_BIN" ] || CXX_BIN="$LLVM_BIN/clang++"
          cmake --preset ci \
            -DCMAKE_C_COMPILER="$C_BIN" \
            -DCMAKE_CXX_COMPILER="$CXX_BIN" \
            -DINFINITY_ENABLE_SANITIZERS=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"

      - name: Build (runs clang-tidy via CMAKE_CXX_CLANG_TIDY)
        run: |
          export PATH="$LLVM_BIN:$PATH"
          cmake --build --preset ci

      - name: Test (UBSan; ASan skipped on macOS, see Configure)
        run: |
          export PATH="$LLVM_BIN:$PATH"
          ctest --preset ci --timeout 180

  build-test-windows:
    name: Build + Test (Windows, clang-cl latest, debug preset)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM + Ninja (choco)
        # Pin LLVM to the 20.x family so Windows matches Linux/macOS (which pin
        # clang-20). Without --version, choco installs whatever "latest" is,
        # and InfinityToolchain requires Clang >= 20 (ADR-025).
        #
        # Install ninja in its own call: choco applies --version to every
        # package in the list, and ninja has no 20.1.4 version. The runner
        # images preinstall LLVM 20.x, so choco needs --allow-downgrade to
        # honor the exact 20.1.4 pin instead of refusing the install.
        run: |
          choco install ninja -y --no-progress
          choco install llvm --version=20.1.4 -y --no-progress --allow-downgrade

      - name: Set up MSVC environment (for clang-cl STL/headers)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (clang-cl; MSVC frontend variant keeps /W4 /WX)
        run: cmake --preset debug -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
        env:
          CC: clang-cl
          CXX: clang-cl

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  release-bench:
    name: Release build + infinity-bench (smoke)
    runs-on: ubuntu-latest
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            clang-20 clang-format-20 clang-tidy-20 \
            libclang-rt-20-dev

      - name: Configure (release, -O2)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build --preset release

      # The bench is NOT CTest-registered (it measures, never asserts — rule
      # 08), so run the executable directly. This job is a smoke gate only: it
      # proves the release build compiles and the bench runs; it does NOT
      # assert on baseline diffs.
      - name: Run infinity-bench
        run: ./build/release/apps/bench/infinity-bench

  format-check:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-20

      - name: Check formatting
        run: ./scripts/format.sh --check

  license-audit:
    name: License audit (ADR-068)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit third-party licenses
        run: ./scripts/check-licenses.sh
