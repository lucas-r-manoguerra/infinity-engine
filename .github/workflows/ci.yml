name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test (ci preset, ASan/UBSan, clang-tidy)
    runs-on: ubuntu-latest
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            clang-20 clang-format-20 clang-tidy-20

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ci

      - name: Build (runs clang-tidy via CMAKE_CXX_CLANG_TIDY)
        run: cmake --build --preset ci

      - name: Test (ASan/UBSan)
        run: ctest --preset ci

  format-check:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-20

      - name: Check formatting
        run: ./scripts/format.sh --check

  license-audit:
    name: License audit (ADR-068)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit third-party licenses
        run: ./scripts/check-licenses.sh
