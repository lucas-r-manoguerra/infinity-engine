name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Test (Linux, ci preset, ASan/UBSan, clang-tidy)
    runs-on: ubuntu-latest
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            clang-20 clang-format-20 clang-tidy-20

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        run: cmake --preset ci

      - name: Build (runs clang-tidy via CMAKE_CXX_CLANG_TIDY)
        run: cmake --build --preset ci

      - name: Test (ASan/UBSan)
        run: ctest --preset ci

  build-test-macos:
    name: Build + Test (macOS, clang 20, ASan/UBSan, clang-tidy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20 toolchain (Homebrew, keg-only)
        run: |
          brew install llvm@20 ninja ccache
          # llvm@20 is keg-only: its versioned binaries are not linked into the
          # default PATH. Resolve the per-arch opt prefix and export it as
          # $LLVM_BIN for the configure/build steps. AppleClang (15/16/17) does
          # not satisfy InfinityToolchain's Clang >= 20 baseline (ADR-025).
          if [ "$(uname -m)" = "arm64" ]; then
            echo "LLVM_BIN=/opt/homebrew/opt/llvm@20/bin" >> "$GITHUB_ENV"
          else
            echo "LLVM_BIN=/usr/local/opt/llvm@20/bin" >> "$GITHUB_ENV"
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        # Full compiler paths: CMake requires either a name on PATH or an
        # absolute path for the compiler. The local PATH export also lets
        # InfinityToolchain find clang-tidy-20 during configure.
        run: |
          export PATH="$LLVM_BIN:$PATH"
          cmake --preset ci \
            -DCMAKE_C_COMPILER="$LLVM_BIN/clang-20" \
            -DCMAKE_CXX_COMPILER="$LLVM_BIN/clang++-20"

      - name: Build (runs clang-tidy via CMAKE_CXX_CLANG_TIDY)
        run: |
          export PATH="$LLVM_BIN:$PATH"
          cmake --build --preset ci

      - name: Test (ASan/UBSan; LSan is unavailable on macOS by design)
        run: ctest --preset ci

  build-test-windows:
    name: Build + Test (Windows, clang-cl latest, debug preset)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM + Ninja (choco)
        run: choco install llvm ninja -y --no-progress

      - name: Set up MSVC environment (for clang-cl STL/headers)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (clang-cl; MSVC frontend variant keeps /W4 /WX)
        run: cmake --preset debug -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
        env:
          CC: clang-cl
          CXX: clang-cl

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  format-check:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-20
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-20

      - name: Check formatting
        run: ./scripts/format.sh --check

  license-audit:
    name: License audit (ADR-068)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit third-party licenses
        run: ./scripts/check-licenses.sh
